name: Skid

options:
  bundleIdPrefix: fi.misaki
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SkidCore:
    path: Packages/SkidCore

targets:
  Skid-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    entitlements:
      path: Sources/iOS/Skid.entitlements
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Skid Jam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Ed25519 track signing is authentication, not confidentiality, so the
        # standard export exemption applies and this stays false — re-checked
        # when signing landed rather than inherited.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.racing
        # **Networked racing needs both of these, and getting the Bonjour list
        # wrong fails SILENTLY** — iOS 14+ simply refuses to browse, which looks
        # like "no peers found" rather than an error. The service names must match
        # `MultipeerTransport.serviceType` exactly, and MultipeerConnectivity
        # needs BOTH the _tcp and _udp spellings registered.
        NSLocalNetworkUsageDescription:
          Skid Jam finds other players' devices nearby so you can race together.
          Nothing leaves your local network.
        NSBonjourServices:
          - _skid-race._tcp
          - _skid-race._udp
        # System-default launch screen (plain background) — the track fades in.
        UILaunchScreen: {}
        # All four orientations: a universal (iPhone + iPad) app must support
        # them for iPad multitasking, or App Store validation rejects the
        # build. The track letterboxes to fit whatever aspect it gets.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # **Experimental features are OFF unless asked for.**
        #
        # Deliberately NOT tied to the DEBUG configuration: an ordinary debug build
        # is what gets driven while testing everything else, and half-finished
        # chrome in the way of that is exactly what this avoids. See
        # docs/experimental-features.md.
        #
        # Turn on for one build without regenerating anything:
        #     xcodebuild ... SKID_EXPERIMENTAL_FLAG=SKID_EXPERIMENTAL
        # or `make run-iphone EXPERIMENTAL=1`.
        #
        # `$(…)` is resolved by XCODE at build time, not by xcodegen — so the
        # generated project is identical either way, and an unset value is simply
        # empty rather than a literal left in the build settings.
        SKID_EXPERIMENTAL_FLAG: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(SKID_EXPERIMENTAL_FLAG)
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.skid
        # User-visible app/bundle name; without this it'd be the target name
        # "Skid-iOS". The Xcode project + targets keep the short "Skid" name;
        # only the product the player sees is "Skid Jam".
        PRODUCT_NAME: Skid Jam
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team committed on purpose (it's not a secret): the release lane
        # archives headlessly with automatic signing, and the generated
        # project must carry the team for that to work.
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SkidCore
        product: SkidKit
    # Explicit scheme so XcodeGen writes a SHARED scheme file — without it,
    # `xcodebuild -scheme Skid-iOS` fails on a fresh checkout.
    scheme:
      configVariants: []
