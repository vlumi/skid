name: Skid

options:
  bundleIdPrefix: fi.misaki
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SkidCore:
    path: Packages/SkidCore

targets:
  Skid-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    entitlements:
      path: Sources/iOS/Skid.entitlements
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Skid Jam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Ed25519 track signing is authentication, not confidentiality, so the
        # standard export exemption applies and this stays false — re-checked
        # when signing landed rather than inherited.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.racing
        # **Networked racing needs both of these, and getting the Bonjour list
        # wrong fails SILENTLY** — iOS 14+ simply refuses to browse, which looks
        # like "no peers found" rather than an error. The service names must match
        # `MultipeerTransport.serviceType` exactly, and MultipeerConnectivity
        # needs BOTH the _tcp and _udp spellings registered.
        # Scanning a track's QR code. Nothing is recorded or sent — the camera
        # is read for codes and the frames are discarded.
        NSCameraUsageDescription:
          Skid Jam uses the camera to scan a track's QR code. Nothing is recorded
          or sent anywhere.
        NSLocalNetworkUsageDescription:
          Skid Jam finds other players' devices nearby so you can race together.
          Nothing leaves your local network.
        NSBonjourServices:
          - _skid-race._tcp
          - _skid-race._udp
        # System-default launch screen (plain background) — the track fades in.
        UILaunchScreen: {}
        # All four orientations: a universal (iPhone + iPad) app must support
        # them for iPad multitasking, or App Store validation rejects the
        # build. The track letterboxes to fit whatever aspect it gets.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # **Experimental features are OFF unless asked for.**
        #
        # Deliberately NOT tied to the DEBUG configuration: an ordinary debug build
        # is what gets driven while testing everything else, and half-finished
        # chrome in the way of that is exactly what this avoids. See
        # docs/experimental-features.md.
        #
        # Turn on for one build without regenerating anything:
        #     xcodebuild ... SKID_EXPERIMENTAL_FLAG=SKID_EXPERIMENTAL
        # or `make run-iphone EXPERIMENTAL=1`.
        #
        # `$(…)` is resolved by XCODE at build time, not by xcodegen — so the
        # generated project is identical either way, and an unset value is simply
        # empty rather than a literal left in the build settings.
        SKID_EXPERIMENTAL_FLAG: ""
        # **The tuning dials are opt-OUT, so this defaults to ON** — the opposite of
        # the flag above, and deliberately: TestFlight builds are RELEASE builds, and
        # on-device tuning is what they are for. Gating the dials as "experimental"
        # would remove them from exactly the builds that need them.
        #
        # Drop them for a production release:
        #     xcodebuild ... SKID_TUNING_FLAG=
        # or `make archive NO_TUNING=1`.
        SKID_TUNING_FLAG: SKID_TUNING
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: >-
            $(inherited) $(SKID_EXPERIMENTAL_FLAG) $(SKID_TUNING_FLAG)
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.skid
        # User-visible app/bundle name; without this it'd be the target name
        # "Skid-iOS". The Xcode project + targets keep the short "Skid" name;
        # only the product the player sees is "Skid Jam".
        PRODUCT_NAME: Skid Jam
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "23"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team committed on purpose (it's not a secret): the release lane
        # archives headlessly with automatic signing, and the generated
        # project must carry the team for that to work.
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SkidCore
        product: SkidKit
    # Explicit scheme so XcodeGen writes a SHARED scheme file — without it,
    # `xcodebuild -scheme Skid-iOS` fails on a fresh checkout.
    scheme:
      configVariants: []

  # **The Mac app: the same game, driven from a keyboard.** Same bundle id as
  # iOS — Universal Purchase — and the same version and build numbers, which
  # the release lane bumps on every target at once and refuses to cut when
  # they differ. The sim is untouched; only input capture differs (see
  # `KeyboardMonitor`), so a Mac races an iPhone in a nearby race as an equal.
  Skid-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
      - path: Sources/Shared
    entitlements:
      path: Sources/macOS/Skid.entitlements
      properties:
        # Sandboxed, as the Mac App Store requires. Nearby racing is the only
        # thing that reaches beyond the app — MultipeerConnectivity both
        # listens and connects, so it needs the client AND server rights.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Skid Jam
        CFBundleName: Skid Jam  # the menu-bar app name (else PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true
        # The Mac App Store validates this one, so it is the exact category
        # identifier rather than the shorter spelling iOS has carried.
        LSApplicationCategoryType: public.app-category.racing-games
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # macOS 15+ asks before local-network access too, with the same keys
        # and the same SILENT failure when the Bonjour list is wrong.
        NSLocalNetworkUsageDescription:
          Skid Jam finds other players' devices nearby so you can race together.
          Nothing leaves your local network.
        NSBonjourServices:
          - _skid-race._tcp
          - _skid-race._udp
    settings:
      base:
        # Same feature flags as iOS, with the same polarity: see the iOS
        # target for why experimental is opt-in and tuning opt-out.
        SKID_EXPERIMENTAL_FLAG: ""
        SKID_TUNING_FLAG: SKID_TUNING
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: >-
            $(inherited) $(SKID_EXPERIMENTAL_FLAG) $(SKID_TUNING_FLAG)
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.skid
        PRODUCT_NAME: Skid Jam
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "23"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SkidCore
        product: SkidKit
    scheme:
      configVariants: []
